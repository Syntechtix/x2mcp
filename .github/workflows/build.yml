#  Runs formatting checks, build, unit tests with 100% coverage enforcement,
#  and per-language integration test suites on every push and pull request to main.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-unit-test:
    name: Build And Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore X2Mcp.slnx
        shell: bash

      - name: Verify Formatting
        run: dotnet format X2Mcp.slnx --verify-no-changes
        shell: bash

      - name: Build Solution
        run: dotnet build X2Mcp.slnx --no-restore -c Release
        shell: bash

      - name: Run Unit Tests
        run: >
          dotnet test X2Mcp.slnx --no-build -c Release --filter "Category!=Integration"
          --collect:"XPlat Code Coverage" --results-directory ./coverage
        shell: bash

      - name: Install Coverage Report Generator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
        shell: bash

      - name: Generate Coverage Report
        run: >
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml"
          -targetdir:coveragereport
          -reporttypes:"MarkdownSummaryGithub;Cobertura"
          -classfilters:"-System.Text.RegularExpressions.Generated*"
        shell: bash

      - name: Publish Coverage Summary
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Enforce Full Line And Branch Coverage
        run: |
          line_coverage=$(grep -oP '(?<=<coverage line-rate=")[^"]+' coveragereport/Cobertura.xml | head -1)
          branch_coverage=$(grep -oP '(?<=branch-rate=")[^"]+' coveragereport/Cobertura.xml | head -1)
          line_percent=$(awk -v c="$line_coverage" 'BEGIN { printf "%.2f", c * 100 }')
          branch_percent=$(awk -v c="$branch_coverage" 'BEGIN { printf "%.2f", c * 100 }')
          echo "Line coverage: ${line_percent}%"
          echo "Branch coverage: ${branch_percent}%"
          failed=0
          if [ "$(awk -v c="$line_coverage" 'BEGIN { print (c < 1) ? "1" : "0" }')" = "1" ]; then
            echo "Line coverage is ${line_percent}%, which is below the required 100%."
            failed=1
          fi
          if [ "$(awk -v c="$branch_coverage" 'BEGIN { print (c < 1) ? "1" : "0" }')" = "1" ]; then
            echo "Branch coverage is ${branch_percent}%, which is below the required 100%."
            failed=1
          fi
          if [ "$failed" = "1" ]; then
            exit 1
          fi
        shell: bash

  integration-dotnet:
    name: .NET Integration Test
    needs: build-and-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore X2Mcp.slnx
        shell: bash

      - name: Run .NET Integration Tests
        run: dotnet test X2Mcp.slnx -c Release --filter "FullyQualifiedName~DotNetEndToEndTests"
        shell: bash

  integration-go:
    name: Go Integration Test
    needs: build-and-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false

      - name: Restore Dependencies
        run: dotnet restore X2Mcp.slnx
        shell: bash

      - name: Run Go Integration Tests
        run: dotnet test X2Mcp.slnx -c Release --filter "FullyQualifiedName~GoEndToEndTests"
        shell: bash

  integration-python:
    name: Python Integration Test
    needs: build-and-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: python -m pip install --upgrade pip mcp pyinstaller
        shell: bash

      - name: Restore Dependencies
        run: dotnet restore X2Mcp.slnx
        shell: bash

      - name: Run Python Integration Tests
        run: dotnet test X2Mcp.slnx -c Release --filter "FullyQualifiedName~PythonEndToEndTests"
        shell: bash

  integration-ruby:
    name: Ruby Integration Test
    needs: build-and-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Restore Dependencies
        run: dotnet restore X2Mcp.slnx
        shell: bash

      - name: Run Ruby Integration Tests
        run: dotnet test X2Mcp.slnx -c Release --filter "FullyQualifiedName~RubyEndToEndTests"
        shell: bash

  integration-rust:
    name: Rust Integration Test
    needs: build-and-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Dependencies
        run: dotnet restore X2Mcp.slnx
        shell: bash

      - name: Run Rust Integration Tests
        run: dotnet test X2Mcp.slnx -c Release --filter "FullyQualifiedName~RustEndToEndTests"
        shell: bash

  go-fixtures-lint:
    name: Go Fixtures Lint
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'tests/unit/X2Mcp.Language.Go.Tests') ||
      contains(github.event.head_commit.modified, 'tests/integration/X2Mcp.Integration.Go.Tests/Fixtures/GoSampleLib')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false

      - name: Show Formatting Diff
        run: gofmt -l -d tests/unit/X2Mcp.Language.Go.Tests tests/integration/X2Mcp.Integration.Go.Tests/Fixtures/GoSampleLib
        shell: bash

      - name: Fail On Unformatted Files
        run: |
          test -z "$(gofmt -l tests/unit/X2Mcp.Language.Go.Tests tests/integration/X2Mcp.Integration.Go.Tests/Fixtures/GoSampleLib)"
        shell: bash

  all-checks-passed:
    name: All Checks Passed
    needs: [build-and-unit-test, integration-dotnet, integration-go, integration-python, integration-ruby, integration-rust, go-fixtures-lint]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify All Required Jobs Passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
        shell: bash
