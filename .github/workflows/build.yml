name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-unit-test:
    name: Build And Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore X2Mcp.slnx
      - name: Verify Formatting
        run: dotnet format X2Mcp.slnx --verify-no-changes
      - name: Build Solution
        run: dotnet build X2Mcp.slnx --no-restore -c Release

      - name: Run Unit Tests
        run: >
          dotnet test X2Mcp.slnx --no-build -c Release --filter "Category!=Integration"
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Install Coverage Report Generator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: >
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml"
          -targetdir:coveragereport
          -reporttypes:"MarkdownSummaryGithub;Cobertura"
          -classfilters:"-System.Text.RegularExpressions.Generated*"

      - name: Publish Coverage Summary
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Full Line Coverage
        run: |
          coverage=$(grep -oP '(?<=<coverage line-rate=")[^"]+' coveragereport/Cobertura.xml | head -1)
          percent=$(awk -v c="$coverage" 'BEGIN { printf "%.2f", c * 100 }')
          echo "Line coverage: ${percent}%"
          below=$(awk -v c="$coverage" 'BEGIN { print (c < 1) ? "1" : "0" }')
          if [ "$below" = "1" ]; then
            echo "Line coverage is ${percent}%, which is below the required 100%."
            exit 1
          fi

  integration-dotnet:
    name: .NET Integration Test
    needs: build-and-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore X2Mcp.slnx
      - name: Run .NET Integration Tests
        run: dotnet test X2Mcp.slnx -c Release --filter "FullyQualifiedName~DotNetEndToEndTests"

  integration-go:
    name: Go Integration Test
    needs: build-and-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false

      - name: Restore Dependencies
        run: dotnet restore X2Mcp.slnx
      - name: Run Go Integration Tests
        run: dotnet test X2Mcp.slnx -c Release --filter "FullyQualifiedName~GoEndToEndTests"

  integration-python:
    name: Python Integration Test
    needs: build-and-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: python -m pip install --upgrade pip mcp pyinstaller

      - name: Restore Dependencies
        run: dotnet restore X2Mcp.slnx
      - name: Run Python Integration Tests
        run: dotnet test X2Mcp.slnx -c Release --filter "FullyQualifiedName~PythonEndToEndTests"

  go-fixtures-lint:
    name: Go Fixtures Lint
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'tests/unit/X2Mcp.Language.Go.Tests') ||
      contains(github.event.head_commit.modified, 'tests/integration/X2Mcp.Integration.Go.Tests/Fixtures/GoSampleLib')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false

      - name: Show Formatting Diff
        run: gofmt -l -d tests/unit/X2Mcp.Language.Go.Tests tests/integration/X2Mcp.Integration.Go.Tests/Fixtures/GoSampleLib
      - name: Fail On Unformatted Files
        run: |
          test -z "$(gofmt -l tests/unit/X2Mcp.Language.Go.Tests tests/integration/X2Mcp.Integration.Go.Tests/Fixtures/GoSampleLib)"

  all-checks-passed:
    name: All Checks Passed
    needs: [build-and-unit-test, integration-dotnet, integration-go, integration-python, go-fixtures-lint]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Verify All Required Jobs Passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
