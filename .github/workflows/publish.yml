name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to increment"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      suffix:
        description: "Optional prerelease suffix (e.g. beta.1, rc.2)"
        type: string
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute Next Version
        id: version
        run: |
          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          version="${latest_tag#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new_version="${major}.${minor}.${patch}"

          suffix="${{ inputs.suffix }}"
          suffix="${suffix#-}"
          if [ -n "$suffix" ]; then
            new_version="${new_version}-${suffix}"
          fi

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore X2Mcp.slnx
      - name: Build Solution
        run: dotnet build X2Mcp.slnx --no-restore -c Release
      - name: Run Unit Tests
        run: dotnet test X2Mcp.slnx --no-build -c Release --filter "Category!=Integration"

      - name: Pack
        run: >
          dotnet pack src/X2Mcp.Cli/X2Mcp.Cli.csproj --no-restore -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -o ./nupkg

      - name: Tag Release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: NuGet Login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push To NuGet
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
